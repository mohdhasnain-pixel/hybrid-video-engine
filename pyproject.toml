[project]
name = "hybrid-video-engine"
version = "0.1.0"
description = "Hybrid AI + FFmpeg video enhancement engine (5.3K / 60 FPS target) for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "torch>=2.4",
    "coremltools>=8.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "moto[s3]>=5"]

[project.scripts]
video-engine = "video_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
