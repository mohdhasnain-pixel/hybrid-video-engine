<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="Storage feature flag: local disk or S3">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}.t{fill:#1f2328}.m{fill:#59636e}
.acc{fill:#0969da}.accs{stroke:#0969da}.accbg{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
.grn{fill:#1a7f37}.grnbg{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.org{fill:#bc4c00}.orgbg{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}
.pur{fill:#8250df}.purbg{fill:#fbefff;stroke:#8250df;stroke-width:1.5}.line{stroke:#8c959f;stroke-width:2;fill:none}.mut{fill:#d0d7de}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.t{fill:#e6edf3}.m{fill:#9198a1}
.acc{fill:#4493f8}.accs{stroke:#4493f8}.accbg{fill:#0c2d6b;stroke:#4493f8}.grn{fill:#3fb950}.grnbg{fill:#0f2d1a;stroke:#3fb950}
.org{fill:#f0883e}.orgbg{fill:#3d1d06;stroke:#f0883e}.pur{fill:#ab7df8}.purbg{fill:#2a1650;stroke:#ab7df8}.line{stroke:#6e7681}.mut{fill:#30363d}}
</style>
<rect class="bg" width="960" height="250" rx="16"/>
<text x="30" y="40" class="t" font-size="19" font-weight="700">Storage feature flag</text>
<text x="30" y="62" class="m" font-size="13.5">One environment variable decides where uploads, outputs and comparison assets live</text>
<rect class="card" x="30" y="92" width="250" height="122" rx="12"/>
<text x="155" y="124" class="t" font-size="15" font-weight="700" text-anchor="middle">Web UI · API · CLI</text>
<text x="155" y="150" class="m" font-size="12.5" text-anchor="middle">upload → job → compare</text>
<rect class="purbg" x="60" y="166" width="190" height="32" rx="8"/>
<text x="155" y="187" class="pur" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">VE_STORAGE_BACKEND</text>
<g class="line"><path d="M280 140 C340 140 340 112 400 112"/><path d="M392 106 l8 6 -8 6"/><path d="M280 170 C340 170 340 196 400 196"/><path d="M392 190 l8 6 -8 6"/></g>
<rect class="grnbg" x="408" y="80" width="250" height="64" rx="10"/>
<text x="424" y="106" class="grn" font-size="14.5" font-weight="700" font-family="ui-monospace,Menlo,monospace">=local (default)</text>
<text x="424" y="128" class="m" font-size="12.5">this computer · ./data/storage</text>
<rect class="accbg" x="408" y="164" width="250" height="64" rx="10"/>
<text x="424" y="190" class="acc" font-size="14.5" font-weight="700" font-family="ui-monospace,Menlo,monospace">=s3</text>
<text x="424" y="212" class="m" font-size="12.5">bucket + prefix · presigned SigV4 URLs</text>
<text x="690" y="104" class="t" font-size="13.5" font-weight="600">Same job flow either way</text>
<text x="690" y="128" class="m" font-size="12.5">• each job remembers its backend</text>
<text x="690" y="150" class="m" font-size="12.5">• S3 mode: only temp work files</text>
<text x="702" y="168" class="m" font-size="12.5">touch local disk, then deleted</text>
<text x="690" y="190" class="m" font-size="12.5">• MinIO / LocalStack via endpoint URL</text>
</svg>
