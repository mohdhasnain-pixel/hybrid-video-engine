<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Hybrid Video Engine: low-resolution video in, 5.3K 60 FPS out">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}.t{fill:#1f2328}.m{fill:#59636e}
.acc{fill:#0969da}.accs{stroke:#0969da}.accbg{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
.grn{fill:#1a7f37}.grnbg{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.org{fill:#bc4c00}.orgbg{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}
.pur{fill:#8250df}.purbg{fill:#fbefff;stroke:#8250df;stroke-width:1.5}.line{stroke:#8c959f;stroke-width:2;fill:none}.mut{fill:#d0d7de}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.t{fill:#e6edf3}.m{fill:#9198a1}
.acc{fill:#4493f8}.accs{stroke:#4493f8}.accbg{fill:#0c2d6b;stroke:#4493f8}.grn{fill:#3fb950}.grnbg{fill:#0f2d1a;stroke:#3fb950}
.org{fill:#f0883e}.orgbg{fill:#3d1d06;stroke:#f0883e}.pur{fill:#ab7df8}.purbg{fill:#2a1650;stroke:#ab7df8}.line{stroke:#6e7681}.mut{fill:#30363d}}
</style>
<rect class="bg" width="960" height="260" rx="16"/>
<text x="40" y="62" class="t" font-size="34" font-weight="700">Hybrid Video Engine</text>
<text x="40" y="94" class="m" font-size="17">AI restoration + super-resolution + frame interpolation, orchestrated with FFmpeg</text>
<g transform="translate(40,128)">
  <rect class="card" width="150" height="86" rx="10"/>
  <text x="75" y="36" class="t" font-size="20" font-weight="700" text-anchor="middle">1080p</text>
  <text x="75" y="62" class="m" font-size="14" text-anchor="middle">30 FPS · compressed</text>
</g>
<g class="line" stroke-width="2.5"><path d="M205 171 H262"/><path d="M254 164 l9 7 -9 7"/></g>
<g transform="translate(275,128)">
  <rect class="purbg" width="118" height="86" rx="10"/><text x="59" y="38" class="pur" font-size="15" font-weight="700" text-anchor="middle">Analyze</text><text x="59" y="60" class="m" font-size="12.5" text-anchor="middle">ffprobe + stats</text>
</g>
<g transform="translate(405,128)">
  <rect class="orgbg" width="118" height="86" rx="10"/><text x="59" y="38" class="org" font-size="15" font-weight="700" text-anchor="middle">Upscale 4×</text><text x="59" y="60" class="m" font-size="12.5" text-anchor="middle">Neural Engine</text>
</g>
<g transform="translate(535,128)">
  <rect class="grnbg" width="118" height="86" rx="10"/><text x="59" y="38" class="grn" font-size="15" font-weight="700" text-anchor="middle">Interpolate</text><text x="59" y="60" class="m" font-size="12.5" text-anchor="middle">RIFE · GPU</text>
</g>
<g class="line" stroke-width="2.5"><path d="M668 171 H725"/><path d="M717 164 l9 7 -9 7"/></g>
<g transform="translate(740,118)">
  <rect class="accbg" width="180" height="106" rx="12"/>
  <text x="90" y="46" class="acc" font-size="26" font-weight="800" text-anchor="middle">5.3K</text>
  <text x="90" y="72" class="t" font-size="15" font-weight="600" text-anchor="middle">5312×2988 · 60 FPS</text>
  <text x="90" y="92" class="m" font-size="12.5" text-anchor="middle">HEVC · audio kept</text>
</g>
</svg>
